; Raise PHP's upload ceiling so the dashboard can accept the intro/hero
; videos (~30MB). post_max_size must stay comfortably above
; upload_max_filesize, since it covers the whole request body, not just
; the file. PHP streams uploads to a temp file, so memory_limit does not
; need to match the file size - but max_input_time does matter: a 30MB
; upload over a slow connection can take minutes.
;
; Read by PHP-FPM/LSAPI (the usual cPanel setup) from the directory the
; script runs in. If the host locks these with php_admin_value, this file
; is ignored - raise them in cPanel > MultiPHP INI Editor instead.
; Changes can take up to 5 minutes to apply (user_ini.cache_ttl).

upload_max_filesize = 64M
post_max_size = 72M
max_input_time = 300
max_execution_time = 300
memory_limit = 256M
